services:
  mongo:
    image: mongo:4.4.30-focal
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--host",
          "127.0.0.1",
          "--port",
          "27017",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 2)"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: 1.0.0
        VCS_REF: local-legacy-cpu
    image: adoptme-final-backend:local
    restart: unless-stopped
    init: true
    environment:
      PORT: 8080
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: adoptme
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  mongo_data:
